<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>lxh写的贪吃蛇 · Snake</title>
    <style>
      :root {
        --bg: #0b1220;
        --bg2: #111c33;
        --card: rgba(255, 255, 255, 0.05);
        --line: rgba(255, 255, 255, 0.1);
        --txt: #e8eefc;
        --dim: #8ea0c4;
        --green: #34d399;
        --cyan: #22d3ee;
        --rose: #fb7185;
        --amber: #fbbf24;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
        background:
          radial-gradient(900px 600px at 15% -10%, #1c3a5e 0%, transparent 60%),
          radial-gradient(
            700px 500px at 100% 100%,
            #23304f 0%,
            transparent 55%
          ),
          var(--bg);
        color: var(--txt);
        min-height: 100%;
        display: flex;
        justify-content: center;
        padding: 24px 16px 40px;
        -webkit-tap-highlight-color: transparent;
      }
      .app {
        width: 100%;
        max-width: 1000px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 26px;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      h1 .dot {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        background: linear-gradient(135deg, var(--green), var(--cyan));
        box-shadow: 0 0 16px rgba(52, 211, 153, 0.6);
      }
      .sub {
        color: var(--dim);
        font-size: 13px;
        margin-top: 6px;
      }

      main {
        display: grid;
        grid-template-columns: 1fr 264px;
        gap: 20px;
        align-items: start;
      }

      .stage {
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(160deg, #0f1b30, #0a1222);
        border: 1px solid var(--line);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        background: rgba(8, 14, 26, 0.72);
        backdrop-filter: blur(6px);
        transition: opacity 0.18s ease;
        padding: 20px;
      }
      .overlay.hide {
        opacity: 0;
        pointer-events: none;
      }
      .overlay h2 {
        font-size: 24px;
        letter-spacing: 1px;
      }
      .overlay p {
        color: var(--dim);
        font-size: 14px;
        line-height: 1.7;
        max-width: 320px;
      }
      .kbd {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid var(--line);
        font-size: 12px;
        color: #fff;
      }
      .big {
        font-size: 44px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--green), var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 12px;
        padding: 11px 26px;
        font-size: 15px;
        font-weight: 600;
        color: #04231a;
        background: linear-gradient(135deg, var(--green), var(--cyan));
        box-shadow: 0 10px 24px rgba(52, 211, 153, 0.28);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          filter 0.12s ease;
      }
      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.06);
      }
      button:active {
        transform: translateY(1px);
      }
      button.ghost {
        background: rgba(255, 255, 255, 0.08);
        color: var(--txt);
        box-shadow: none;
        border: 1px solid var(--line);
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 14px;
      }
      .card h3 {
        font-size: 12px;
        letter-spacing: 1.6px;
        color: var(--dim);
        text-transform: uppercase;
        margin-bottom: 12px;
        font-weight: 600;
      }

      .scores {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .score {
        background: rgba(0, 0, 0, 0.22);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
      }
      .score .n {
        font-size: 24px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .score .l {
        font-size: 11px;
        color: var(--dim);
        margin-top: 2px;
      }
      .score.best .n {
        color: var(--amber);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }
      .row:last-child {
        margin-bottom: 0;
      }
      .row span {
        font-size: 13px;
        color: var(--dim);
      }
      .seg {
        display: flex;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 3px;
        gap: 2px;
      }
      .seg button {
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 500;
        border-radius: 8px;
        background: transparent;
        color: var(--dim);
        box-shadow: none;
      }
      .seg button.on {
        background: linear-gradient(135deg, var(--green), var(--cyan));
        color: #04231a;
        font-weight: 700;
      }

      .switch {
        width: 46px;
        height: 26px;
        border-radius: 99px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--line);
        position: relative;
        cursor: pointer;
        transition: background 0.18s;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #94a8c8;
        transition:
          transform 0.18s,
          background 0.18s;
      }
      .switch.on {
        background: rgba(52, 211, 153, 0.35);
      }
      .switch.on::after {
        transform: translateX(20px);
        background: var(--green);
      }

      .keys {
        font-size: 12.5px;
        color: var(--dim);
        line-height: 2;
      }
      .keys b {
        color: var(--txt);
        font-weight: 600;
      }

      .dpad {
        display: none;
        grid-template-columns: repeat(3, 56px);
        grid-template-rows: repeat(2, 56px);
        gap: 8px;
        justify-content: center;
        margin-top: 14px;
      }
      .dpad button {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--line);
        color: var(--txt);
        font-size: 20px;
        padding: 0;
        box-shadow: none;
        border-radius: 14px;
      }
      .dpad .u {
        grid-column: 2;
      }
      .dpad .l {
        grid-column: 1;
        grid-row: 2;
      }
      .dpad .d {
        grid-column: 2;
        grid-row: 2;
      }
      .dpad .r {
        grid-column: 3;
        grid-row: 2;
      }

      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
        }
        .dpad {
          display: grid;
        }
        .panel {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0 14px;
        }
        .panel .card:nth-child(1) {
          grid-column: 1/-1;
        }
      }
      @media (max-width: 520px) {
        .panel {
          grid-template-columns: 1fr;
        }
        h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1><span class="dot"></span>贪吃蛇 SNAKE</h1>
          <div class="sub">方向键 / WASD 控制 · 空格暂停 · R 重开</div>
        </div>
        <button id="btnMain" class="ghost">开始游戏</button>
      </header>

      <main>
        <div>
          <div class="stage">
            <canvas id="game" width="660" height="660"></canvas>
            <div class="overlay" id="overlay">
              <h2 id="ovTitle">准备好了吗？</h2>
              <div id="ovScore" class="big" style="display: none">0</div>
              <p id="ovText">
                用 <span class="kbd">↑</span><span class="kbd">↓</span
                ><span class="kbd">←</span><span class="kbd">→</span> 或
                <span class="kbd">W</span><span class="kbd">A</span
                ><span class="kbd">S</span
                ><span class="kbd">D</span> 控制小蛇吃到食物，别撞到墙和自己。
              </p>
              <button id="ovBtn">开始游戏</button>
            </div>
          </div>

          <div class="dpad">
            <button class="u" data-dir="up">↑</button>
            <button class="l" data-dir="left">←</button>
            <button class="d" data-dir="down">↓</button>
            <button class="r" data-dir="right">→</button>
          </div>
        </div>

        <div class="panel">
          <div class="card">
            <h3>Score</h3>
            <div class="scores">
              <div class="score">
                <div class="n" id="score">0</div>
                <div class="l">当前得分</div>
              </div>
              <div class="score best">
                <div class="n" id="best">0</div>
                <div class="l">最高纪录</div>
              </div>
            </div>
            <div class="scores" style="margin-top: 10px">
              <div class="score">
                <div class="n" id="len" style="font-size: 20px">3</div>
                <div class="l">当前长度</div>
              </div>
              <div class="score">
                <div class="n" id="lv" style="font-size: 20px">1</div>
                <div class="l">速度等级</div>
              </div>
            </div>
          </div>

          <div class="card">
            <h3>Settings</h3>
            <div class="row">
              <span>难度</span>
              <div class="seg" id="segSpeed">
                <button data-v="8">悠闲</button>
                <button data-v="12" class="on">普通</button>
                <button data-v="17">困难</button>
                <button data-v="24">极速</button>
              </div>
            </div>
            <div class="row">
              <span>边界</span>
              <div class="seg" id="segWall">
                <button data-v="wall" class="on">撞墙结束</button>
                <button data-v="wrap">穿墙</button>
              </div>
            </div>
            <div class="row">
              <span>音效</span>
              <div class="switch on" id="swSound"></div>
            </div>
          </div>

          <div class="card">
            <h3>Controls</h3>
            <div class="keys">
              <b>↑ ↓ ← →</b> / <b>W A S D</b> 移动<br />
              <b>空格</b> 暂停 / 继续<br />
              <b>R</b> 重新开始<br />
              <b>移动端</b> 在画面上滑动
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      (function () {
        "use strict";

        /* ---------- 基础配置 ---------- */
        const COLS = 22,
          ROWS = 22;
        const BASE = 30; // 单格逻辑像素
        const W = COLS * BASE,
          H = ROWS * BASE;
        const BEST_KEY = "snake.best.v1";
        const SET_KEY = "snake.settings.v1";

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        function fitCanvas() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        fitCanvas();
        window.addEventListener("resize", fitCanvas);

        /* ---------- 状态 ---------- */
        const settings = Object.assign(
          { speed: 12, wall: "wall", sound: true },
          JSON.parse(localStorage.getItem(SET_KEY) || "{}"),
        );
        let best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0;

        let snake, prev, dir, queue, food, score, eaten;
        let alive = false,
          paused = false,
          started = false;
        let acc = 0,
          last = 0,
          raf = 0,
          foodPulse = 0;

        const $ = (id) => document.getElementById(id);
        const el = {
          score: $("score"),
          best: $("best"),
          len: $("len"),
          lv: $("lv"),
          overlay: $("overlay"),
          ovTitle: $("ovTitle"),
          ovText: $("ovText"),
          ovScore: $("ovScore"),
          ovBtn: $("ovBtn"),
          btnMain: $("btnMain"),
          swSound: $("swSound"),
        };

        function saveSettings() {
          localStorage.setItem(SET_KEY, JSON.stringify(settings));
        }

        function reset() {
          const cy = Math.floor(ROWS / 2);
          snake = [
            { x: 5, y: cy },
            { x: 4, y: cy },
            { x: 3, y: cy },
          ];
          prev = snake.map((s) => ({ ...s }));
          dir = { x: 1, y: 0 };
          queue = [];
          score = 0;
          eaten = 0;
          acc = 0;
          alive = true;
          paused = false;
          placeFood();
          syncHUD();
        }

        function placeFood() {
          const free = [];
          for (let y = 0; y < ROWS; y++)
            for (let x = 0; x < COLS; x++)
              if (!snake.some((s) => s.x === x && s.y === y))
                free.push({ x, y });
          if (!free.length) {
            food = null;
            return;
          }
          food = free[Math.floor(Math.random() * free.length)];
        }

        function syncHUD() {
          el.score.textContent = score;
          el.best.textContent = best;
          el.len.textContent = snake.length;
          el.lv.textContent = 1 + Math.floor(eaten / 5);
        }

        /* ---------- 音效（WebAudio，无外部资源） ---------- */
        let ac = null;
        function beep(freq, dur, type, gain) {
          if (!settings.sound) return;
          try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            const o = ac.createOscillator(),
              g = ac.createGain();
            o.type = type || "square";
            o.frequency.value = freq;
            g.gain.setValueAtTime(gain || 0.05, ac.currentTime);
            g.gain.exponentialRampToValueAtTime(
              0.0001,
              ac.currentTime + (dur || 0.08),
            );
            o.connect(g).connect(ac.destination);
            o.start();
            o.stop(ac.currentTime + (dur || 0.08));
          } catch (e) {}
        }
        const sfxEat = () => beep(760, 0.07, "square", 0.05);
        const sfxDie = () => {
          beep(180, 0.18, "sawtooth", 0.07);
          setTimeout(() => beep(110, 0.28, "sawtooth", 0.06), 130);
        };

        /* ---------- 输入 ---------- */
        const DIRS = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 },
        };
        const KEYMAP = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right",
          w: "up",
          s: "down",
          a: "left",
          d: "right",
          W: "up",
          S: "down",
          A: "left",
          D: "right",
        };

        function turn(name) {
          const d = DIRS[name];
          if (!d) return;
          const ref = queue.length ? queue[queue.length - 1] : dir;
          if (ref.x === -d.x && ref.y === -d.y) return; // 禁止 180° 掉头
          if (ref.x === d.x && ref.y === d.y) return; // 同向忽略
          if (queue.length < 2) queue.push(d);
          if (paused) resume();
        }

        window.addEventListener("keydown", (e) => {
          if (
            ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(
              e.key,
            )
          )
            e.preventDefault();
          const name = KEYMAP[e.key];
          if (name) {
            started && turn(name);
            return;
          }
          if (e.key === " " || e.key === "Enter") {
            if (!alive || !started) start();
            else paused ? resume() : pause();
          }
          if (e.key === "r" || e.key === "R") start();
        });

        // 触摸滑动
        let tx = 0,
          ty = 0;
        canvas.addEventListener(
          "touchstart",
          (e) => {
            const t = e.changedTouches[0];
            tx = t.clientX;
            ty = t.clientY;
          },
          { passive: true },
        );
        canvas.addEventListener(
          "touchend",
          (e) => {
            const t = e.changedTouches[0];
            const dx = t.clientX - tx,
              dy = t.clientY - ty;
            if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
            turn(
              Math.abs(dx) > Math.abs(dy)
                ? dx > 0
                  ? "right"
                  : "left"
                : dy > 0
                  ? "down"
                  : "up",
            );
          },
          { passive: true },
        );
        document.querySelectorAll(".dpad button").forEach((b) => {
          b.addEventListener("click", () => turn(b.dataset.dir));
        });

        /* ---------- 流程控制 ---------- */
        function hideOverlay() {
          el.overlay.classList.add("hide");
        }
        function showOverlay(title, text, btn, bigScore) {
          el.ovTitle.textContent = title;
          el.ovText.innerHTML = text;
          el.ovBtn.textContent = btn;
          if (bigScore || bigScore === 0) {
            el.ovScore.style.display = "";
            el.ovScore.textContent = bigScore;
          } else el.ovScore.style.display = "none";
          el.overlay.classList.remove("hide");
        }

        function start() {
          started = true;
          reset();
          hideOverlay();
          el.btnMain.textContent = "重新开始";
          last = performance.now();
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(loop);
        }
        function pause() {
          if (!alive) return;
          paused = true;
          showOverlay(
            "已暂停",
            "按 <span class='kbd'>空格</span> 或点击下方按钮继续。",
            "继续游戏",
          );
        }
        function resume() {
          if (!alive) return;
          paused = false;
          acc = 0;
          last = performance.now();
          hideOverlay();
        }
        function gameOver() {
          alive = false;
          sfxDie();
          if (score > best) {
            best = score;
            localStorage.setItem(BEST_KEY, String(best));
          }
          syncHUD();
          showOverlay(
            "游戏结束",
            "撞上" + (lastHit === "self" ? "自己" : "墙壁") + "了，再来一局？",
            "再来一局",
            score,
          );
        }
        let lastHit = "wall";

        el.ovBtn.addEventListener("click", () => {
          if (!alive || !started) start();
          else resume();
        });
        el.btnMain.addEventListener("click", () => {
          if (!started || !alive) start();
          else if (paused) resume();
          else {
            start();
          }
        });

        /* ---------- 每步逻辑 ---------- */
        function stepDelay() {
          // eaten 每 5 个提速一档，最多 2 倍速
          const boost = 1 + Math.min(Math.floor(eaten / 5) * 0.12, 1.0);
          return 1000 / (settings.speed * boost);
        }

        function tick() {
          if (queue.length) dir = queue.shift();

          prev = snake.map((s) => ({ ...s }));
          const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

          // 边界
          if (settings.wall === "wrap") {
            head.x = (head.x + COLS) % COLS;
            head.y = (head.y + ROWS) % ROWS;
          } else if (
            head.x < 0 ||
            head.y < 0 ||
            head.x >= COLS ||
            head.y >= ROWS
          ) {
            lastHit = "wall";
            gameOver();
            return;
          }

          // 撞自己（允许尾巴格，因为尾巴会移开）
          const willEat = food && head.x === food.x && head.y === food.y;
          const body = willEat ? snake : snake.slice(0, -1);
          if (body.some((s) => s.x === head.x && s.y === head.y)) {
            lastHit = "self";
            gameOver();
            return;
          }

          snake.unshift(head);
          if (willEat) {
            score += 10;
            eaten++;
            sfxEat();
            placeFood();
          } else {
            snake.pop();
          }
          syncHUD();
        }

        /* ---------- 绘制 ---------- */
        function roundRect(x, y, w, h, r) {
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
          else {
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
          }
        }

        function drawGrid() {
          ctx.strokeStyle = "rgba(255,255,255,.035)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let x = 1; x < COLS; x++) {
            ctx.moveTo(x * BASE, 0);
            ctx.lineTo(x * BASE, H);
          }
          for (let y = 1; y < ROWS; y++) {
            ctx.moveTo(0, y * BASE);
            ctx.lineTo(W, y * BASE);
          }
          ctx.stroke();
        }

        function lerpPos(i, t) {
          const cur = snake[i];
          const old = prev[i] || cur;
          if (Math.abs(cur.x - old.x) > 1 || Math.abs(cur.y - old.y) > 1)
            return cur; // 穿墙不插值
          return {
            x: old.x + (cur.x - old.x) * t,
            y: old.y + (cur.y - old.y) * t,
          };
        }

        function drawSnake(t) {
          const n = snake.length;
          for (let i = n - 1; i >= 0; i--) {
            const p = lerpPos(i, t);
            const k = i / Math.max(n - 1, 1); // 0 头 → 1 尾
            const size = BASE * (0.92 - k * 0.2);
            const off = (BASE - size) / 2;
            const x = p.x * BASE + off,
              y = p.y * BASE + off;

            const g = ctx.createLinearGradient(x, y, x + size, y + size);
            g.addColorStop(
              0,
              `hsl(${158 - k * 22}, ${72 - k * 14}%, ${62 - k * 16}%)`,
            );
            g.addColorStop(
              1,
              `hsl(${188 - k * 18}, ${70 - k * 12}%, ${52 - k * 12}%)`,
            );

            ctx.save();
            ctx.shadowColor = "rgba(52,211,153,.45)";
            ctx.shadowBlur = i === 0 ? 18 : 6;
            ctx.fillStyle = g;
            roundRect(x, y, size, size, size * 0.32);
            ctx.fill();
            ctx.restore();

            if (i === 0) drawEyes(p);
          }
        }

        function drawEyes(p) {
          const cx = p.x * BASE + BASE / 2,
            cy = p.y * BASE + BASE / 2;
          const px = -dir.y,
            py = dir.x; // 垂直方向
          const fx = dir.x * 3.5,
            fy = dir.y * 3.5; // 朝向前移
          const r = BASE * 0.085;
          [
            [1, -1],
            [1, 1],
          ].forEach(([a, b]) => {
            const ex = cx + px * a * BASE * 0.18 + fx;
            const ey = cy + py * a * BASE * 0.18 + fy;
            ctx.fillStyle = "#0b1220";
            ctx.beginPath();
            ctx.arc(ex, ey, r * 1.9, 0, 7);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(ex, ey, r, 0, 7);
            ctx.fill();
          });
        }

        function drawFood(pulse) {
          if (!food) return;
          const cx = food.x * BASE + BASE / 2,
            cy = food.y * BASE + BASE / 2;
          const r = BASE * 0.3 * (1 + pulse * 0.12);

          ctx.save();
          ctx.shadowColor = "rgba(251,113,133,.85)";
          ctx.shadowBlur = 22;
          const g = ctx.createRadialGradient(
            cx - r * 0.3,
            cy - r * 0.3,
            r * 0.15,
            cx,
            cy,
            r,
          );
          g.addColorStop(0, "#fecdd3");
          g.addColorStop(1, "#e11d48");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, 7);
          ctx.fill();
          ctx.restore();

          // 高光
          ctx.fillStyle = "rgba(255,255,255,.6)";
          ctx.beginPath();
          ctx.arc(cx - r * 0.3, cy - r * 0.35, r * 0.22, 0, 7);
          ctx.fill();
        }

        function render(t) {
          ctx.clearRect(0, 0, W, H);
          // 背景
          const bg = ctx.createLinearGradient(0, 0, W, H);
          bg.addColorStop(0, "#101c30");
          bg.addColorStop(1, "#0a1222");
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, W, H);

          // 边界高亮（撞墙模式下画一圈提示）
          if (settings.wall === "wall") {
            ctx.strokeStyle = "rgba(251,113,133,.28)";
            ctx.lineWidth = 2;
            ctx.strokeRect(1, 1, W - 2, H - 2);
          }

          drawGrid();
          drawFood(Math.sin(foodPulse));
          if (snake) drawSnake(t);
        }

        /* ---------- 主循环 ---------- */
        function loop(now) {
          raf = requestAnimationFrame(loop);
          const dt = Math.min(now - last, 200);
          last = now;
          foodPulse += dt / 260;

          if (alive && !paused) {
            acc += dt;
            const step = stepDelay();
            let guard = 0;
            while (acc >= step && alive && !paused && guard++ < 5) {
              acc -= step;
              tick();
            }
          }
          render(alive && !paused ? Math.min(acc / stepDelay(), 1) : 1);
        }

        /* ---------- 设置面板 ---------- */
        function bindSeg(id, key, cast) {
          const box = $(id);
          box.addEventListener("click", (e) => {
            const b = e.target.closest("button");
            if (!b) return;
            [...box.children].forEach((c) => c.classList.toggle("on", c === b));
            settings[key] = cast ? cast(b.dataset.v) : b.dataset.v;
            saveSettings();
            acc = 0;
            render(1);
          });
        }
        bindSeg("segSpeed", "speed", (v) => parseInt(v, 10));
        bindSeg("segWall", "wall");

        el.swSound.addEventListener("click", () => {
          settings.sound = !settings.sound;
          el.swSound.classList.toggle("on", settings.sound);
          saveSettings();
          if (settings.sound) sfxEat();
        });

        // 恢复设置 UI
        [...$("segSpeed").children].forEach((b) =>
          b.classList.toggle(
            "on",
            parseInt(b.dataset.v, 10) === settings.speed,
          ),
        );
        [...$("segWall").children].forEach((b) =>
          b.classList.toggle("on", b.dataset.v === settings.wall),
        );
        el.swSound.classList.toggle("on", settings.sound);

        /* ---------- 启动 ---------- */
        reset();
        alive = false;
        started = false;
        el.best.textContent = best;
        render(1);
        raf = requestAnimationFrame(function idle(now) {
          last = now;
          raf = requestAnimationFrame(loop);
        });
      })();
    </script>
  </body>
</html>
